# Continuous Integration Workflow
#
# This is a reusable workflow (workflow_call) - it is NOT triggered directly by events.
# It is called by build.yaml on pull_request (lint only) and on push to main (full pipeline).
#
# Pipeline:
#   1. Lint (parallel)   - Validate Dockerfile
#   2. Docker build      - Build Docker image using the application artifact (runs after all lints pass)
#   3. Docker scan/push  - Scan image for vulnerabilities and push to the container registry (parallel)
#
# The output `image_and_tag` is passed to the downstream repository so it knows
# which image to deploy.

name: CI

on:
  workflow_call:
    outputs:
      image_and_tag:
        description: Fully qualified image reference
        value: ${{ jobs.docker-push.outputs.image_and_tag }}

jobs:
  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1

  docker-build:
    if: github.repository_owner == 'entur' && github.event_name == 'push'
    needs: [docker-lint]
    uses: entur/gha-docker/.github/workflows/build.yml@v1

  docker-scan:
    name: Docker Scan
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    secrets: inherit
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  docker-push:
    needs: [docker-build]
    uses: entur/gha-docker/.github/workflows/push.yml@v1
    secrets: inherit

  deploy-downstream:
    name: Trigger Downstream Deployment
    if: github.repository_owner == 'entur' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker-push]
    steps:
      # TODO: This step is currently not working, as it requires either a PAT
      # or a GitHub App token.
      - name: Trigger downstream deployment
        run: |
          repo_owner="entur"
          repo_name="oss-test-deployment-config"
          event_type="trigger-deploy-downstream"
          service="oss-test"
          image_and_tag="${{ needs.docker-push.outputs.image_and_tag }}"
          echo "Triggering downstream deployment for $service with version $image_and_tag"
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.APPROPRIATE_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            --data-binary @- <<EOF
          {
            "event_type": "$event_type",
            "client_payload": {
              "service": "$service",
              "image_and_tag": "$image_and_tag"
            }
          }
          EOF
